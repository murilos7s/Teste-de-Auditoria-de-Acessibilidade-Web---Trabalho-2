<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TechInclusiva - Acessível</title>
</head>
<body>
    <header>
        <h1>Portal TechInclusiva</h1>
    </header>
    <main>
        <!-- Correção 1: Adicionado atributo alt descritivo -->
        <img src="banner.jpg" alt="Banner do Portal TechInclusiva promovendo inclusão digital">

        <!-- Correção 2: Adicionada label associada ao campo de formulário -->
        <form>
            <label for="nome-usuario">Nome Completo:</label>
            <input type="text" id="nome-usuario" name="nome" placeholder="Digite seu nome">
            <button type="submit">Enviar</button>
        </form>

        <!-- Correção 3: Ajustada a razão de contraste (texto escuro em fundo claro) -->
        <p style="color: #1A1A1A; background-color: #FFFFFF;">Este texto possui alto contraste acessível.</p>

        <!-- Correção 4: Adicionado texto descritivo e atributo de acessibilidade ao botão -->
        <button type="button" aria-label="Acessar menu de configurações">Configurações</button>
    </main>
</body>
</html>
