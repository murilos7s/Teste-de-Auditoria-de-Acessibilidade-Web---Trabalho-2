<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TechInclusiva</title>
</head>
<body>
    <header>
        <h1>Portal TechInclusiva</h1>
    </header>
    <main>
        <!-- Problema: Imagem sem atributo alt -->
        <img src="banner.jpg">

        <!-- Problema: Formulário sem rótulos (label) acessíveis -->
        <form>
            <input type="text" placeholder="Digite seu nome">
            <button type="submit">Enviar</button>
        </form>

        <!-- Problema: Baixo contraste de cor -->
        <p style="color: #ccc; background-color: #fff;">Este texto tem baixo contraste.</p>

        <!-- Problema: Botão sem texto/acessibilidade -->
        <button></button>
    </main>
</body>
</html>
